<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Saldãonline - Loja</title>
</head>
<body>
  <h1>Bem-vindo à Saldãonline</h1>
  <div id="produtos"></div>
  <script>
    const user = JSON.parse(localStorage.getItem("usuarioLogado"));
    if (!user) window.location.href = "login.html";

    const API_URL = "https://saldonline-api.onrender.com";
    fetch(`${API_URL}/produtos`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("produtos").innerHTML =
          data.map(p => `<div><strong>${p.nome}</strong>: R$ ${p.preco}</div>`).join("");
      });
  </script>
</body>
</html>
