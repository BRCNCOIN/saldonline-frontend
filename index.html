<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Saldãonline - Produtos</title>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <h1>Bem-vindo à Saldãonline!</h1>
  <button onclick="logout()">Sair</button>
  <div id="produtos"></div>

  <script>
    fetch("https://saldonline-api.onrender.com/produtos")
      .then(res => res.json())
      .then(produtos => {
        const div = document.getElementById("produtos");
        produtos.forEach(p => {
          const item = document.createElement("div");
          item.textContent = `${p.nome} - R$ ${p.preco}`;
          div.appendChild(item);
        });
      });
  </script>
</body>
</html>
